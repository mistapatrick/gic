name: Production Conditions Bulk Ingestion (manual, via Vercel route)

# No longer runs on a schedule. This route's own first live run timed out
# ("the operation was aborted due to timeout", 0 rows written) — FAOSTAT's
# bulk file is a whole-world, whole-history export, genuinely too large for
# a 45s fetch inside Vercel Hobby's 60s maxDuration ceiling (see
# bulk-backfill.ts's own fetch-timeout comment, which predicted exactly
# this). The scheduled weekly run now lives in
# weekly-production-conditions-bulk-direct-ingest.yml instead, which calls
# scripts/run-production-conditions-bulk-backfill.ts directly on the GitHub
# Actions runner — no 60s ceiling there. This workflow is kept as a
# manual-trigger fallback only (e.g. to re-exercise the Vercel route itself
# after a deploy); both write into the same idempotent production_conditions
# table, so running either (or both) is always safe.
on:
  workflow_dispatch: # Manual trigger from the GitHub UI

jobs:
  trigger-ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel production-conditions bulk ingest endpoint
        run: |
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -X POST "${{ secrets.VERCEL_APP_URL }}/api/ingest/production-conditions-bulk" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          cat response.json
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Ingestion failed with HTTP $HTTP_STATUS"
            exit 1
          fi
