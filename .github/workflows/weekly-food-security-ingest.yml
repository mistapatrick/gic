name: Weekly Sunday 0159 WAT Food Security (HDX HAPI) Ingestion

on:
  schedule:
    # 00:59 UTC Sunday == 01:59 WAT (GMT+1) Sunday — offset from the other
    # weekly ingest crons so they don't all hit Vercel in the same minute;
    # each domain's cron is fully independent either way.
    - cron: "59 0 * * 0"
  workflow_dispatch: # Manual trigger from the GitHub UI

jobs:
  trigger-ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel food-security ingest endpoint
        run: |
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -X POST "${{ secrets.VERCEL_APP_URL }}/api/ingest/food-security" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          cat response.json
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Ingestion failed with HTTP $HTTP_STATUS"
            exit 1
          fi
